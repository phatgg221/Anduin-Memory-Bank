[project]
name = "anduin-memory-bank-backend"
version = "0.1.0"
description = "Anduin Memory Bank API: case triage, precedent retrieval, and delta intelligence"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.1",
    "minio>=7.2.20",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.alembic]
# Migrations: `bun run db:revision "message"` (autogenerate) → review → `bun run db:migrate`.
script_location = "%(here)s/migrations"
# Sortable names: 20261015_0930_<rev>_<slug>.py
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]
truncate_slug_length = 40

# Format, then lint-fix, every generated revision so it passes `bun run lint` untouched.
[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "exec"
executable = "ruff"
options = "format --quiet REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "exec"
executable = "ruff"
options = "check --fix --quiet REVISION_SCRIPT_FILENAME"
