name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend · lint, format, migrations, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory_bank
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memory -d memory_bank"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://memory:memory@localhost:5432/memory_bank
      MINIO_ENDPOINT: localhost:9000
      MINIO_PUBLIC_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: ci-access
      MINIO_SECRET_KEY: ci-secret-key-1234
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0000
    steps:
      - uses: actions/checkout@v5
      - name: Start MinIO
        working-directory: .
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Wait for MinIO
        run: timeout 60 bash -c 'until curl -fsS http://localhost:9000/minio/health/live; do sleep 2; done'
      - name: Migrations apply and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests
        run: uv run pytest -q

  frontend:
    name: Frontend · format, lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Prettier
        run: bun run format:check
      - name: ESLint
        run: bun run lint
      - name: TypeScript
        run: bun run typecheck
      - name: Next build
        run: bun run build

  realtime:
    name: Realtime & deploy scripts · types, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy scripts typecheck
        run: bun install --frozen-lockfile && bunx tsc -p tsconfig.json
      - name: Realtime install
        working-directory: realtime
        run: bun install --frozen-lockfile
      - name: Realtime typecheck
        working-directory: realtime
        run: bunx tsc --noEmit
      - name: Worker bundle (dry run)
        working-directory: realtime
        env:
          WRANGLER_SEND_METRICS: "false"
        run: bunx wrangler deploy --dry-run --outdir dist

  backend-image:
    name: Backend · production image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
