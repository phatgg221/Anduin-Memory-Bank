name: Deploy

# Production deploy, after CI passes on main (or by hand). One-time setup: `bun run deploy ci-setup` (docs/DEPLOY.md).
# Runtime config (env vars, secrets) lives on each platform and is kept as is; this only ships new code.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  realtime:
    name: Realtime → Cloudflare Workers
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    defaults:
      run:
        working-directory: realtime
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: bunx wrangler deploy

  backend:
    name: Backend → Cloud Run
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: gcloud run deploy
        run: |
          gcloud run deploy dejavu-api --source backend \
            --project "${{ vars.GCP_PROJECT }}" --region "${{ vars.GCP_REGION }}" --quiet
      - name: Health check
        run: |
          url=$(gcloud run services describe dejavu-api --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION }}" --format='value(status.url)')
          for attempt in 1 2 3 4 5 6; do
            health=$(curl -fsS "$url/api/health" || true)
            echo "$health"
            echo "$health" | grep -q '"database":true' && echo "$health" | grep -q '"storage":true' && exit 0
            sleep 10
          done
          exit 1

  frontend:
    name: Frontend → Vercel
    needs: [realtime, backend]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Pull production settings and env vars
        run: bunx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build
        run: bunx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy
        run: bunx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
